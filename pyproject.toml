[project]
name = "nova-backend"
version = "0.1.0"
description = "Supplier follow-up backend with mandatory human approvals"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pypdf>=5,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "reportlab>=4,<5",
    "google-auth-oauthlib>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nova"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
